<!doctype html>
<!-- The README banner (docs/banner.png, 1600x533) and social preview
     (docs/social.png, 1280x640): one design, rendered at both sizes with a
     headless Chromium. The palette is the TUI's (styles.go) and the memory
     graph's: terminal dark, ink, dim, and the default cyan accent. The title
     is a 5x7 pixel font drawn cell by cell, "brain" in ink and "gent" in the
     accent like the TUI's brand. -->
<meta charset="utf-8">
<title>banner</title>
<style>
  :root { --bg:#0c0e11; --bg2:#111418; --ink:#e8eaed; --dim:#6b7380; --hair:#1f242b;
          --accent:#2bd6c4; --shade:#0f4a44;
          --mono:"JetBrains Mono", "JetBrainsMono Nerd Font", ui-monospace, monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { background:radial-gradient(ellipse at 50% 42%, var(--bg2), var(--bg) 70%);
         color:var(--ink); font-family:var(--mono); display:grid; place-items:center; position:relative; }
  /* a dot grid and scanlines: a screen, not a page */
  body::before { content:""; position:absolute; inset:0;
                 background-image:radial-gradient(rgba(232,234,237,.07) 1px, transparent 1.2px);
                 background-size:22px 22px; }
  body::after { content:""; position:absolute; inset:0; pointer-events:none;
                background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
  .frame { position:absolute; inset:4.2vh 2.2vw; border:1px solid var(--hair); border-radius:10px; }
  .frame .bar { position:absolute; top:0; left:0; right:0; height:clamp(22px, 5.6vh, 34px);
                border-bottom:1px solid var(--hair); display:flex; align-items:center; gap:8px; padding:0 14px; }
  .frame .bar i { width:10px; height:10px; border-radius:50%; background:var(--hair); }
  .frame .bar span { margin-left:auto; color:var(--dim); font-size:clamp(10px, 2.2vh, 13px); letter-spacing:.08em; }
  .box { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center;
         gap:clamp(18px, 5.4vh, 34px); margin-top:3vh; }
  .logo { display:grid; gap:0; }
  .logo b { width:var(--px); height:var(--px); display:block; }
  .on-ink { background:var(--ink); box-shadow:calc(var(--px) * .22) calc(var(--px) * .22) 0 #2a2f36; }
  .on-acc { background:var(--accent); box-shadow:calc(var(--px) * .22) calc(var(--px) * .22) 0 var(--shade); }
  .prompt { font-size:clamp(13px, min(3.9vh, 1.55vw), 24px); color:var(--dim); letter-spacing:.02em; white-space:nowrap; }
  .prompt .p { color:var(--accent); }
  .prompt .c { color:var(--ink); }
  .prompt .cur { display:inline-block; width:.6em; height:1.1em; background:var(--accent);
                 vertical-align:-.18em; margin-left:.35em; }
  .keys { font-size:clamp(11px, min(2.7vh, 1.1vw), 16px); color:var(--dim); white-space:nowrap; }
  .keys b { color:var(--accent); font-weight:700; margin-right:.45em; }
  .keys .sep { display:inline-block; width:2.2em; }
</style>
<div class="frame"><div class="bar"><i></i><i></i><i></i><span>↓0 ↑0 · up to date · ⌂ laptop ⇄ desktop</span></div></div>
<div class="box">
  <div class="logo" id="logo"></div>
  <div class="prompt"><span class="p">$</span> <span class="c">braingent</span> &nbsp;# config, memory and sessions for Claude Code, in a repo you own<span class="cur"></span></div>
  <div class="keys"><b>S</b>sync<span class="sep"></span><b>g</b>graph<span class="sep"></span><b>/</b>search<span class="sep"></span><b>↵</b>read<span class="sep"></span><b>?</b>keys</div>
</div>
<script>
// 5x7 glyphs, one string per row
const G = {
  B:["####.","#...#","#...#","####.","#...#","#...#","####."],
  R:["####.","#...#","#...#","####.","#.#..","#..#.","#...#"],
  A:[".###.","#...#","#...#","#####","#...#","#...#","#...#"],
  I:["#####","..#..","..#..","..#..","..#..","..#..","#####"],
  N:["#...#","##..#","#.#.#","#.#.#","#..##","#...#","#...#"],
  G:[".####","#....","#....","#..##","#...#","#...#",".###."],
  E:["#####","#....","#....","####.","#....","#....","#####"],
  T:["#####","..#..","..#..","..#..","..#..","..#..","..#.."],
};
const word = "BRAINGENT", accentFrom = 5, gap = 1;
const cols = word.length * (5 + gap) - gap;
// the logo takes ~64% of the width, or 30% of the height, whichever is smaller
const px = Math.floor(Math.min(innerWidth * .64 / cols, innerHeight * .30 / 7));
const logo = document.getElementById("logo");
logo.style.setProperty("--px", px + "px");
logo.style.gridTemplateColumns = `repeat(${cols}, ${px}px)`;
for (let r = 0; r < 7; r++)
  for (let c = 0; c < cols; c++) {
    const k = Math.floor(c / (5 + gap)), x = c % (5 + gap);
    const on = x < 5 && G[word[k]][r][x] === "#";
    const cell = document.createElement("b");
    if (on) cell.className = k >= accentFrom ? "on-acc" : "on-ink";
    logo.append(cell);
  }
</script>
